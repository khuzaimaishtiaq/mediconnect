<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MediConnect Premium</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366F1', // Indigo-500 for a softer premium look
                        primaryDark: '#4338CA',
                        secondary: '#14B8A6', // Teal-500
                        dark: '#0F172A',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['"Outfit"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- Phosphor Icons (for UI elements) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0F172A;
            /* Dark premium background for the device frame illusion */
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* The Premium Mobile Canvas */
        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            background: #F8FAFC;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            overflow-x: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        /* Animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-pop-in {
            animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-100 {
            animation-delay: 100ms;
        }

        .delay-200 {
            animation-delay: 200ms;
        }

        .delay-300 {
            animation-delay: 300ms;
        }

        /* Premium Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Rich Gradients */
        .gradient-primary {
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
        }

        .gradient-card {
            background: linear-gradient(135deg, #F8FAFC 0%, #FFFFFF 100%);
        }

        .gradient-text {
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Inputs */
        input:focus {
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        /* Soft Element Hover */
        .interactive-card {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .interactive-card:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const supabaseUrl = 'https://chbmcijdkxqyblxqrull.supabase.co';
        const supabaseKey = 'sb_publishable_UA3C1NOnHm6dehrPT6cu6w_wwqMMsSI';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const App = () => {
            const [currentView, setCurrentView] = useState('splash');
            const [user, setUser] = useState(null);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    if (session) { setUser(session.user); setCurrentView('home'); }
                    else { setTimeout(() => setCurrentView('auth'), 2500); }
                });

                supabase.auth.onAuthStateChange((_event, session) => {
                    if (session) { setUser(session.user); setCurrentView('home'); }
                    else { setUser(null); setCurrentView('auth'); }
                });
            }, []);

            return (
                <div className="mobile-container text-slate-800">
                    {currentView === 'splash' && <SplashScreen />}
                    {currentView === 'auth' && <AuthView />}
                    {currentView === 'home' && <HomeView user={user} setView={setCurrentView} />}
                    {currentView === 'doctors' && <DoctorsDirectory setView={setCurrentView} />}
                    {currentView === 'profile' && <ProfileView user={user} setView={setCurrentView} />}

                    {['home', 'doctors', 'profile'].includes(currentView) && (
                        <BottomNav current={currentView} setView={setCurrentView} />
                    )}
                </div>
            );
        };

        const SplashScreen = () => (
            <div className="flex flex-col items-center justify-center h-screen gradient-primary text-white relative overflow-hidden">
                <div className="absolute top-1/4 -right-20 w-72 h-72 bg-white rounded-full mix-blend-overlay filter blur-3xl opacity-20 animate-pulse"></div>
                <div className="absolute -bottom-20 -left-20 w-96 h-96 bg-indigo-400 rounded-full mix-blend-overlay filter blur-3xl opacity-30 animate-pulse delay-200"></div>

                <div className="animate-pop-in z-10 flex flex-col items-center">
                    <div className="w-24 h-24 bg-white/20 rounded-[28px] backdrop-blur-xl flex items-center justify-center mb-6 shadow-2xl border border-white/30">
                        <i className="ph-fill ph-heartbeat text-5xl text-white"></i>
                    </div>
                    <h1 className="text-4xl font-extrabold tracking-tight mb-2">MediConnect</h1>
                    <p className="text-indigo-100 font-medium tracking-wide">Elevated Healthcare.</p>
                </div>
            </div>
        );

        const AuthView = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [role, setRole] = useState('patient');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const handleAuth = async (e) => {
                e.preventDefault();
                setLoading(true); setError(null);

                try {
                    let result;
                    const emailString = username.trim().toLowerCase() + '@mediconnect.app';
                    if (isLogin) {
                        result = await supabase.auth.signInWithPassword({ email: emailString, password });
                    } else {
                        result = await supabase.auth.signUp({
                            email: emailString, password,
                            options: { data: { name, role } }
                        });
                        if (result.data.user) {
                            await supabase.from('profiles').insert([
                                { id: result.data.user.id, name, email: emailString, role }
                            ]).select();
                        }
                    }
                    if (result.error) throw result.error;
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="h-screen flex flex-col bg-slate-50 relative overflow-hidden">
                    <div className="absolute top-[-150px] right-[-100px] w-96 h-96 bg-indigo-100 rounded-full blur-3xl opacity-60"></div>
                    <div className="absolute bottom-[-100px] left-[-100px] w-80 h-80 bg-teal-50 rounded-full blur-3xl opacity-60"></div>

                    <div className="flex-1 flex flex-col justify-center px-6 z-10 animate-fade-up">
                        <div className="mb-10 mt-10">
                            <h2 className="text-4xl font-extrabold text-slate-800 mb-3">{isLogin ? 'Welcome\nBack' : 'Create\nAccount'}</h2>
                            <p className="text-slate-500 font-medium text-lg">{isLogin ? 'Sign in to access your appointments.' : 'Sign up for premium healthcare.'}</p>
                        </div>

                        {error && <div className="glass-card text-red-500 p-4 rounded-2xl mb-6 text-sm font-semibold border-red-100 flex items-center gap-2"><i className="ph-fill ph-warning-circle text-lg"></i> {error}</div>}

                        <form onSubmit={handleAuth} className="flex flex-col gap-4 animate-fade-up delay-100">
                            {!isLogin && (
                                <input type="text" placeholder="Full Name" required value={name} onChange={e => setName(e.target.value)}
                                    className="w-full px-5 py-4 rounded-2xl bg-white/80 border border-white focus:border-primary focus:bg-white transition-all shadow-sm font-medium" />
                            )}
                            <input type="text" placeholder="Username" required value={username} onChange={e => setUsername(e.target.value)}
                                className="w-full px-5 py-4 rounded-2xl bg-white/80 border border-white focus:border-primary focus:bg-white transition-all shadow-sm font-medium" />
                            <input type="password" placeholder="Password" required value={password} onChange={e => setPassword(e.target.value)}
                                className="w-full px-5 py-4 rounded-2xl bg-white/80 border border-white focus:border-primary focus:bg-white transition-all shadow-sm font-medium" />

                            {!isLogin && (
                                <div className="flex bg-white/60 p-1.5 rounded-2xl shadow-inner mt-2">
                                    <button type="button" onClick={() => setRole('patient')}
                                        className={`flex-1 py-3.5 rounded-[12px] text-sm font-bold transition-all ${role === 'patient' ? 'bg-white shadow-[0_4px_12px_rgba(0,0,0,0.05)] text-primary' : 'text-slate-500'}`}>Patient</button>
                                    <button type="button" onClick={() => setRole('doctor')}
                                        className={`flex-1 py-3.5 rounded-[12px] text-sm font-bold transition-all ${role === 'doctor' ? 'bg-white shadow-[0_4px_12px_rgba(0,0,0,0.05)] text-primary' : 'text-slate-500'}`}>Doctor</button>
                                </div>
                            )}

                            <button type="submit" disabled={loading} className="w-full mt-6 py-4.5 gradient-primary text-white rounded-2xl text-lg font-bold shadow-[0_8px_20px_rgba(99,102,241,0.3)] hover:shadow-[0_12px_25px_rgba(99,102,241,0.4)] transition-all flex items-center justify-center interactive-card disabled:opacity-75 h-[60px]">
                                {loading ? <i className="ph ph-spinner animate-spin text-2xl"></i> : (isLogin ? 'Sign In' : 'Create Account')}
                            </button>
                        </form>

                        <button onClick={() => setIsLogin(!isLogin)} className="mt-8 text-slate-500 font-semibold hover:text-primary transition-colors text-center animate-fade-up delay-200">
                            {isLogin ? "Don't have an account? Sign up" : "Already have an account? Sign in"}
                        </button>
                    </div>
                </div>
            );
        };

        const HomeView = ({ user, setView }) => {
            const name = user?.user_metadata?.name || 'User';
            const specialties = [
                { name: 'Cardiology', icon: 'ph-heart', color: 'text-rose-500', bg: 'bg-rose-50' },
                { name: 'Dentistry', icon: 'ph-tooth', color: 'text-cyan-500', bg: 'bg-cyan-50' },
                { name: 'Neurology', icon: 'ph-brain', color: 'text-violet-500', bg: 'bg-violet-50' },
                { name: 'General', icon: 'ph-stethoscope', color: 'text-emerald-500', bg: 'bg-emerald-50' },
            ];

            return (
                <div className="pb-28 min-h-screen bg-slate-50 relative">
                    <div className="bg-slate-900 pt-16 pb-32 px-6 rounded-b-[40px] text-white relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-primary rounded-full filter blur-[80px] opacity-20"></div>

                        <div className="flex justify-between items-center mb-8 relative z-10 animate-fade-up">
                            <div>
                                <p className="text-slate-400 text-sm font-medium mb-1">Good Morning,</p>
                                <h2 className="text-3xl font-bold tracking-tight">{name} <span className="inline-block animate-bounce">👋</span></h2>
                            </div>
                            <div className="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center backdrop-blur-md cursor-pointer border border-white/10 interactive-card" onClick={() => setView('profile')}>
                                <i className="ph-fill ph-user text-2xl"></i>
                            </div>
                        </div>
                    </div>

                    <div className="px-6 -mt-24 relative z-10">
                        <div className="glass-card rounded-[24px] p-2 flex items-center shadow-[0_10px_40px_rgba(0,0,0,0.08)] mb-8 animate-fade-up delay-100">
                            <div className="w-12 h-12 bg-primary rounded-2xl flex items-center justify-center text-white m-1">
                                <i className="ph-bold ph-magnifying-glass text-xl"></i>
                            </div>
                            <input type="text" placeholder="Search specialists, clinics..." onClick={() => setView('doctors')}
                                className="flex-1 bg-transparent border-none text-slate-800 font-medium px-3 focus:outline-none placeholder-slate-400" />
                        </div>

                        <div className="flex justify-between items-center mb-5 animate-fade-up delay-100">
                            <h3 className="text-xl font-bold text-slate-800">Specialties</h3>
                            <button className="text-primary font-bold text-sm bg-indigo-50 px-3 py-1.5 rounded-lg">See All</button>
                        </div>

                        <div className="grid grid-cols-4 gap-4 mb-10 animate-fade-up delay-200">
                            {specialties.map((s, i) => (
                                <div key={i} className="flex flex-col items-center gap-3 interactive-card cursor-pointer" onClick={() => setView('doctors')}>
                                    <div className={`w-16 h-16 rounded-[20px] flex items-center justify-center ${s.bg} border-2 border-white shadow-sm`}>
                                        <i className={`ph-fill ${s.icon} text-3xl ${s.color}`}></i>
                                    </div>
                                    <span className="text-[11px] font-bold text-slate-600 tracking-wide uppercase">{s.name}</span>
                                </div>
                            ))}
                        </div>

                        <div className="gradient-primary rounded-[32px] p-7 text-white mb-10 relative overflow-hidden shadow-[0_15px_30px_rgba(99,102,241,0.2)] animate-fade-up delay-300 interactive-card">
                            <div className="absolute right-[-10px] top-[-10px] bg-white/10 w-32 h-32 rounded-full blur-2xl"></div>
                            <i className="ph-fill ph-shield-check absolute right-4 top-1/2 -translate-y-1/2 text-8xl opacity-10"></i>

                            <div className="bg-white/20 w-fit px-3 py-1 rounded-lg text-xs font-bold mb-3 backdrop-blur-md">PRO TIP</div>
                            <h3 className="text-2xl font-bold mb-2">Daily Wellness</h3>
                            <p className="text-white/80 font-medium max-w-[70%] mb-5 text-sm leading-relaxed">Hydration improves skin health and cognitive function.</p>
                            <button className="px-5 py-2.5 bg-white text-primary text-sm font-bold rounded-xl shadow-lg interactive-card">Read More</button>
                        </div>

                        <div className="flex justify-between items-center mb-5 animate-fade-up delay-300">
                            <h3 className="text-xl font-bold text-slate-800">Top Rated Doctors</h3>
                        </div>
                        <div className="flex hide-scrollbar overflow-x-auto gap-5 pb-8 -mx-6 px-6 animate-fade-up delay-300">
                            {[1, 2, 3].map(i => (
                                <div key={i} className="min-w-[280px] bg-white p-5 rounded-[28px] shadow-[0_8px_25px_rgba(0,0,0,0.04)] border border-slate-100 interactive-card">
                                    <div className="flex items-center gap-4">
                                        <div className="w-16 h-16 bg-slate-100 rounded-[20px] flex items-center justify-center shrink-0">
                                            <i className="ph-fill ph-user-md text-3xl text-slate-400"></i>
                                        </div>
                                        <div>
                                            <h4 className="font-extrabold text-lg text-slate-800">Dr. Sarah Jenkins</h4>
                                            <p className="text-sm font-medium text-slate-500 mb-1">Cardiologist</p>
                                            <div className="flex items-center gap-1 text-xs font-bold bg-amber-50 text-amber-600 w-fit px-2 py-1 rounded-lg">
                                                <i className="ph-fill ph-star"></i> 4.9 <span className="opacity-70 ml-1">(120)</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const DoctorsDirectory = ({ setView }) => {
            return (
                <div className="pb-28 bg-slate-50 min-h-screen">
                    <div className="glass-nav pt-14 pb-4 px-6 sticky top-0 z-20">
                        <h2 className="text-3xl font-extrabold text-slate-900 mb-5 animate-fade-up">Find Specialist</h2>
                        <div className="flex gap-3 hide-scrollbar overflow-x-auto pb-2 animate-fade-up delay-100">
                            {['All Specialists', 'Cardiology', 'Dental', 'Neurology'].map((t, i) => (
                                <button key={i} className={`px-6 py-3 rounded-[16px] text-sm font-bold whitespace-nowrap transition-all ${i === 0 ? 'gradient-primary text-white shadow-lg' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'}`}>
                                    {t}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="p-6 flex flex-col gap-5">
                        {[1, 2, 3, 4].map(i => (
                            <div key={i} className="bg-white p-5 rounded-[28px] shadow-[0_8px_25px_rgba(0,0,0,0.04)] border border-slate-100 flex gap-5 items-center cursor-pointer interactive-card animate-fade-up" style={{ animationDelay: `${i * 100}ms` }}>
                                <div className="w-[84px] h-[84px] bg-indigo-50 rounded-[22px] flex items-center justify-center text-primary relative overflow-hidden shrink-0">
                                    <i className="ph-fill ph-user-circle text-5xl"></i>
                                </div>
                                <div className="flex-1">
                                    <h4 className="font-extrabold text-xl text-slate-900">Dr. Michael Chen</h4>
                                    <p className="text-sm font-medium text-slate-500 mb-3">Neurologist • City Hospital</p>
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-1.5 text-xs font-bold text-amber-500 bg-amber-50 px-2 py-1.5 rounded-lg">
                                            <i className="ph-fill ph-star"></i> 4.9
                                        </div>
                                        <span className="text-xs font-bold text-primary bg-indigo-50 px-3 py-1.5 rounded-lg">$150/hr</span>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const ProfileView = ({ user, setView }) => {
            const handleLogout = async () => { await supabase.auth.signOut(); };

            return (
                <div className="pb-28 min-h-screen bg-slate-50">
                    <div className="pt-16 pb-24 px-6 gradient-primary text-white text-center rounded-b-[40px] shadow-xl relative animate-fade-up">
                        <div className="absolute top-4 right-4 p-2 bg-white/20 rounded-full backdrop-blur-md cursor-pointer" onClick={() => setView('home')}>
                            <i className="ph-bold ph-x text-xl"></i>
                        </div>
                        <div className="w-28 h-28 bg-white/20 rounded-[32px] flex items-center justify-center mx-auto mb-5 backdrop-blur-xl border-2 border-white/50 shadow-inner">
                            <i className="ph-fill ph-user text-6xl"></i>
                        </div>
                        <h2 className="text-3xl font-extrabold">{user?.user_metadata?.name || 'User'}</h2>
                        <div className="inline-block mt-2 bg-white/20 px-4 py-1.5 rounded-full backdrop-blur-md">
                            <p className="font-medium text-white text-sm">{user?.email}</p>
                        </div>
                    </div>

                    <div className="p-6 -mt-10 relative z-10 animate-fade-up delay-100">
                        <div className="glass-card rounded-[32px] overflow-hidden mb-6 p-2">
                            {[
                                { icon: 'ph-user-gear', text: 'Personal Details' },
                                { icon: 'ph-bell-ringing', text: 'Notifications' },
                                { icon: 'ph-shield-check', text: 'Privacy & Security' },
                            ].map((item, i) => (
                                <div key={i} className="flex items-center gap-5 p-4 rounded-[24px] cursor-pointer hover:bg-slate-50/50 transition-colors interactive-card">
                                    <div className="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center text-primary shrink-0 border border-slate-100">
                                        <i className={`ph-fill ${item.icon} text-2xl`}></i>
                                    </div>
                                    <span className="font-bold text-slate-800 text-lg flex-1">{item.text}</span>
                                    <div className="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-400">
                                        <i className="ph-bold ph-caret-right"></i>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <button onClick={handleLogout} className="w-full flex items-center justify-center gap-3 py-5 bg-rose-50 text-rose-500 rounded-[28px] font-extrabold text-lg interactive-card shadow-sm border border-rose-100 animate-fade-up delay-200">
                            <i className="ph-bold ph-sign-out text-xl"></i> Sign Out
                        </button>
                    </div>
                </div>
            );
        };

        const BottomNav = ({ current, setView }) => {
            const tabs = [
                { id: 'home', icon: 'ph-house' },
                { id: 'doctors', icon: 'ph-magnifying-glass' },
                { id: 'appointments', icon: 'ph-calendar-check' },
                { id: 'profile', icon: 'ph-user' }
            ];

            return (
                <div className="fixed bottom-6 left-6 right-6 max-w-[432px] mx-auto z-50 animate-fade-up delay-300">
                    <div className="glass-nav flex justify-around items-center h-[72px] px-2 shadow-[0_15px_40px_rgba(0,0,0,0.1)] rounded-[28px] border border-white/60 bg-white/80">
                        {tabs.map(t => {
                            const active = current === t.id;
                            return (
                                <div key={t.id} onClick={() => setView(t.id)}
                                    className={`relative flex flex-col items-center justify-center w-16 h-[56px] rounded-[20px] cursor-pointer transition-all duration-300 ${active ? 'bg-primary text-white shadow-[0_4px_12px_rgba(99,102,241,0.3)]' : 'text-slate-400 hover:text-slate-600 hover:bg-slate-100'}`}>
                                    <i className={`${active ? 'ph-fill' : 'ph'} ${t.icon} text-[24px] transition-transform ${active ? 'scale-110' : ''}`}></i>
                                </div>
                            )
                        })}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
