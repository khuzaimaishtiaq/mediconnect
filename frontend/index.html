<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MediConnect Application</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5', // Indigo-600
                        secondary: '#10B981', // Emerald-500
                        dark: '#111827',
                        light: '#F3F4F6'
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- Phosphor Icons (for UI elements) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB;
            -webkit-tap-highlight-color: transparent;
        }

        /* Hide scrollbar for carousels */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow-x: hidden;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-bar {
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Initialize Supabase (Using standard CDN object)
        const supabaseUrl = 'https://chbmcijdkxqyblxqrull.supabase.co';
        const supabaseKey = 'sb_publishable_UA3C1NOnHm6dehrPT6cu6w_wwqMMsSI';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const App = () => {
            const [currentView, setCurrentView] = useState('splash');
            const [user, setUser] = useState(null);

            useEffect(() => {
                // Check active session
                supabase.auth.getSession().then(({ data: { session } }) => {
                    if (session) {
                        setUser(session.user);
                        setCurrentView('home');
                    } else {
                        setTimeout(() => setCurrentView('onboarding'), 2000);
                    }
                });

                supabase.auth.onAuthStateChange((_event, session) => {
                    if (session) {
                        setUser(session.user);
                        setCurrentView('home');
                    } else {
                        setUser(null);
                        setCurrentView('auth');
                    }
                });
            }, []);

            return (
                <div className="mobile-container text-gray-800">
                    {currentView === 'splash' && <SplashScreen />}
                    {currentView === 'onboarding' && <OnboardingView setView={setCurrentView} />}
                    {currentView === 'auth' && <AuthView />}
                    {currentView === 'home' && <HomeView user={user} setView={setCurrentView} />}
                    {currentView === 'doctors' && <DoctorsDirectory setView={setCurrentView} />}
                    {currentView === 'appointments' && <AppointmentsView setView={setCurrentView} />}
                    {currentView === 'profile' && <ProfileView user={user} setView={setCurrentView} />}

                    {/* Bottom Navigation */}
                    {['home', 'doctors', 'appointments', 'profile'].includes(currentView) && (
                        <BottomNav current={currentView} setView={setCurrentView} />
                    )}
                </div>
            );
        };

        const SplashScreen = () => (
            <div className="flex flex-col items-center justify-center h-screen bg-primary fade-in text-white">
                <i className="ph-fill ph-heartbeat text-8xl mb-4 animate-pulse"></i>
                <h1 className="text-4xl font-bold tracking-tight">MediConnect</h1>
                <p className="opacity-80 mt-2">Your Health, One Tap Away</p>
            </div>
        );

        const OnboardingView = ({ setView }) => {
            const [step, setStep] = useState(0);
            const slides = [
                { title: 'Find Specialists', desc: 'Browse thousands of verified doctors by specialty.', icon: 'ph-stethoscope' },
                { title: 'Book Instantly', desc: 'Schedule video or in-person visits in seconds.', icon: 'ph-calendar-check' },
                { title: 'Manage Health', desc: 'Keep track of all your active and past appointments.', icon: 'ph-notebook' }
            ];

            return (
                <div className="flex flex-col h-screen p-6 fade-in items-center text-center pt-24 bg-gradient-to-b from-blue-50 to-white">
                    <div className="w-32 h-32 rounded-full bg-blue-100 flex items-center justify-center mb-8">
                        <i className={`ph ${slides[step].icon} text-6xl text-primary`}></i>
                    </div>
                    <h2 className="text-3xl font-bold mb-4">{slides[step].title}</h2>
                    <p className="text-gray-500 mb-12 text-lg px-4">{slides[step].desc}</p>

                    <div className="flex gap-2 mb-12">
                        {slides.map((_, i) => (
                            <div key={i} className={`h-2 rounded-full transition-all duration-300 ${i === step ? 'w-8 bg-primary' : 'w-2 bg-gray-300'}`}></div>
                        ))}
                    </div>

                    <div className="mt-auto w-full pb-8">
                        {step < slides.length - 1 ? (
                            <button onClick={() => setStep(s => s + 1)} className="w-full py-4 bg-primary text-white rounded-2xl text-lg font-semibold shadow-lg hover:shadow-xl transition-all">
                                Next
                            </button>
                        ) : (
                            <button onClick={() => setView('auth')} className="w-full py-4 bg-primary text-white rounded-2xl text-lg font-semibold shadow-lg hover:shadow-xl transition-all">
                                Get Started
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        const AuthView = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [role, setRole] = useState('patient');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const handleAuth = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError(null);

                try {
                    let result;
                    const emailString = username + '@mediconnect.app';
                    if (isLogin) {
                        result = await supabase.auth.signInWithPassword({ email: emailString, password });
                    } else {
                        result = await supabase.auth.signUp({
                            email: emailString, password,
                            options: { data: { name, role } }
                        });

                        // Wait slightly for trigger/insert
                        if (result.data.user) {
                            await supabase.from('profiles').insert([
                                { id: result.data.user.id, name, email: emailString, role }
                            ]).select();
                        }
                    }
                    if (result.error) throw result.error;
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="h-screen flex flex-col p-6 fade-in bg-white justify-center">
                    <div className="text-center mb-10">
                        <i className="ph-fill ph-heartbeat text-5xl text-primary mb-2"></i>
                        <h2 className="text-3xl font-bold">{isLogin ? 'Welcome Back' : 'Create Account'}</h2>
                        <p className="text-gray-500 mt-2">{isLogin ? 'Login to manage your appointments' : 'Sign up to start booking'}</p>
                    </div>

                    {error && <div className="bg-red-50 text-red-500 p-4 rounded-xl mb-6 text-sm font-medium">{error}</div>}

                    <form onSubmit={handleAuth} className="flex flex-col gap-5">
                        {!isLogin && (
                            <input type="text" placeholder="Full Name" required value={name} onChange={e => setName(e.target.value)}
                                className="w-full px-5 py-4 rounded-2xl bg-gray-50 border border-gray-100 focus:outline-none focus:ring-2 focus:ring-primary transition-all" />
                        )}
                        <input type="text" placeholder="Username" required value={username} onChange={e => setUsername(e.target.value)}
                            className="w-full px-5 py-4 rounded-2xl bg-gray-50 border border-gray-100 focus:outline-none focus:ring-2 focus:ring-primary transition-all" />
                        <input type="password" placeholder="Password" required value={password} onChange={e => setPassword(e.target.value)}
                            className="w-full px-5 py-4 rounded-2xl bg-gray-50 border border-gray-100 focus:outline-none focus:ring-2 focus:ring-primary transition-all" />

                        {!isLogin && (
                            <div className="flex bg-gray-50 p-2 rounded-2xl border border-gray-100">
                                <button type="button" onClick={() => setRole('patient')}
                                    className={`flex-1 py-3 rounded-xl text-sm font-semibold transition-all ${role === 'patient' ? 'bg-white shadow-sm text-primary' : 'text-gray-500'}`}>Patient</button>
                                <button type="button" onClick={() => setRole('doctor')}
                                    className={`flex-1 py-3 rounded-xl text-sm font-semibold transition-all ${role === 'doctor' ? 'bg-white shadow-sm text-primary' : 'text-gray-500'}`}>Doctor</button>
                            </div>
                        )}

                        <button type="submit" disabled={loading} className="w-full mt-2 py-4 bg-primary text-white flex justify-center items-center rounded-2xl text-lg font-semibold shadow-lg hover:shadow-xl transition-all disabled:opacity-70">
                            {loading ? <i className="ph ph-spinner animate-spin text-2xl"></i> : (isLogin ? 'Login' : 'Sign Up')}
                        </button>
                    </form>

                    <button onClick={() => setIsLogin(!isLogin)} className="mt-8 text-gray-500 font-medium hover:text-primary transition-colors">
                        {isLogin ? "Don't have an account? Sign up" : "Already have an account? Login"}
                    </button>
                </div>
            );
        };

        const HomeView = ({ user, setView }) => {
            const name = user?.user_metadata?.name || 'User';

            const specialties = [
                { name: 'Cardiology', icon: 'ph-heart', color: 'bg-red-50 text-red-500' },
                { name: 'Dental', icon: 'ph-tooth', color: 'bg-blue-50 text-blue-500' },
                { name: 'Eye Care', icon: 'ph-eye', color: 'bg-green-50 text-green-500' },
                { name: 'General', icon: 'ph-stethoscope', color: 'bg-purple-50 text-purple-500' },
            ];

            return (
                <div className="pb-24 fade-in">
                    <div className="bg-primary pt-12 pb-6 px-6 rounded-b-[40px] text-white shadow-lg">
                        <div className="flex justify-between items-center mb-6">
                            <div>
                                <p className="opacity-80 text-sm font-medium">Good Morning,</p>
                                <h2 className="text-2xl font-bold">{name} 👋</h2>
                            </div>
                            <div className="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm cursor-pointer" onClick={() => setView('profile')}>
                                <i className="ph ph-user text-2xl"></i>
                            </div>
                        </div>
                        <div className="relative">
                            <i className="ph ph-magnifying-glass absolute left-4 top-4 text-gray-400 text-xl"></i>
                            <input type="text" placeholder="Search doctor, specialty..." onClick={() => setView('doctors')}
                                className="w-full py-4 pl-12 pr-4 rounded-2xl bg-white text-gray-800 focus:outline-none shadow-md" />
                        </div>
                    </div>

                    <div className="p-6">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-bold">Specialties</h3>
                            <button className="text-primary text-sm font-semibold">See All</button>
                        </div>
                        <div className="grid grid-cols-4 gap-4 mb-8">
                            {specialties.map((s, i) => (
                                <div key={i} className="flex flex-col items-center gap-2 cursor-pointer" onClick={() => setView('doctors')}>
                                    <div className={`w-16 h-16 rounded-2xl flex items-center justify-center ${s.color}`}>
                                        <i className={`ph ${s.icon} text-3xl`}></i>
                                    </div>
                                    <span className="text-xs font-semibold text-gray-600 line-clamp-1">{s.name}</span>
                                </div>
                            ))}
                        </div>

                        <div className="bg-gradient-to-r from-blue-500 to-primary rounded-3xl p-6 text-white mb-8 relative overflow-hidden shadow-lg">
                            <i className="ph-fill ph-pill absolute right-[-20px] top-[-20px] text-8xl opacity-10"></i>
                            <h3 className="text-lg font-bold mb-2">Daily Wellness</h3>
                            <p className="text-sm opacity-90 max-w-[80%] mb-4">Drink 8 glasses of water daily to maintain good health and skin.</p>
                            <button className="px-4 py-2 bg-white text-primary text-xs font-bold rounded-xl shadow-sm">Read Tips</button>
                        </div>

                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-bold">Recommended</h3>
                            <button className="text-primary text-sm font-semibold" onClick={() => setView('doctors')}>See All</button>
                        </div>
                        <div className="flex hide-scrollbar overflow-x-auto gap-4 pb-4">
                            {[1, 2, 3].map(i => (
                                <div key={i} className="min-w-[240px] bg-white p-4 rounded-3xl shadow-sm border border-gray-100">
                                    <div className="flex items-center gap-3">
                                        <div className="w-14 h-14 bg-gray-100 rounded-2xl flex items-center justify-center">
                                            <i className="ph-fill ph-user-md text-2xl text-gray-400"></i>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-sm">Dr. Sarah Jenkins</h4>
                                            <p className="text-xs text-gray-500">Cardiologist</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-1 mt-4 text-xs font-semibold text-primary bg-blue-50 w-fit px-2 py-1 rounded-lg">
                                        <i className="ph-fill ph-star"></i> 4.8 (120 reviews)
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const DoctorsDirectory = ({ setView }) => {
            const [selectedDoctor, setSelectedDoctor] = useState(null);

            if (selectedDoctor) return <DoctorProfile doc={selectedDoctor} goBack={() => setSelectedDoctor(null)} />;

            return (
                <div className="pb-24 fade-in bg-gray-50 min-h-screen">
                    <div className="bg-white p-6 pt-12 rounded-b-[30px] border-b border-gray-100 shadow-sm sticky top-0 z-10">
                        <h2 className="text-2xl font-bold mb-4">Find a Doctor</h2>
                        <div className="flex gap-2 hide-scrollbar overflow-x-auto pb-2">
                            {['All', 'Cardiology', 'Dental', 'Neurology'].map((t, i) => (
                                <button key={i} className={`px-5 py-2.5 rounded-full text-sm font-semibold whitespace-nowrap transition-all ${i === 0 ? 'bg-primary text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                                    {t}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="p-6 flex flex-col gap-4">
                        {[1, 2, 3, 4].map(i => (
                            <div key={i} onClick={() => setSelectedDoctor({ id: i })} className="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex gap-4 items-center cursor-pointer hover:shadow-md transition-all">
                                <div className="w-20 h-20 bg-blue-50 rounded-2xl flex items-center justify-center text-primary">
                                    <i className="ph-fill ph-user-circle text-4xl"></i>
                                </div>
                                <div className="flex-1">
                                    <h4 className="font-bold text-lg">Dr. Michael Chen</h4>
                                    <p className="text-sm text-gray-500 mb-2">Neurologist • City Hospital</p>
                                    <div className="flex items-center gap-1 text-xs font-semibold text-yellow-500">
                                        <i className="ph-fill ph-star"></i> 4.9 <span className="text-gray-400 font-normal ml-1">(80 reviews)</span>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const DoctorProfile = ({ doc, goBack }) => {
            return (
                <div className="fade-in bg-gray-50 min-h-screen pb-24 border-t-0">
                    <div className="relative h-64 bg-primary text-white p-6 pt-12">
                        <button onClick={goBack} className="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm shadow-sm absolute top-12 left-6">
                            <i className="ph ph-caret-left text-xl"></i>
                        </button>
                        <div className="absolute -bottom-12 w-[calc(100%-48px)] mx-auto bg-white rounded-3xl p-6 shadow-xl border border-gray-50 text-gray-800 flex items-center gap-5 top-[180px] h-32">
                            <div className="w-20 h-20 bg-blue-50 rounded-2xl flex items-center justify-center text-primary shrink-0">
                                <i className="ph-fill ph-user-circle text-5xl"></i>
                            </div>
                            <div>
                                <h2 className="text-xl font-bold">Dr. Michael Chen</h2>
                                <p className="text-sm text-primary font-semibold mb-1">Neurologist</p>
                                <p className="text-xs text-gray-500"><i className="ph-fill ph-map-pin mr-1"></i>City Hospital, NY</p>
                            </div>
                        </div>
                    </div>

                    <div className="mt-28 px-6">
                        <div className="flex gap-4 mb-8">
                            <div className="flex-1 bg-white p-4 rounded-2xl text-center shadow-sm border border-gray-50">
                                <i className="ph-fill ph-users text-2xl text-blue-500 mb-1"></i>
                                <h4 className="font-bold">2,000+</h4>
                                <p className="text-xs text-gray-500">Patients</p>
                            </div>
                            <div className="flex-1 bg-white p-4 rounded-2xl text-center shadow-sm border border-gray-50">
                                <i className="ph-fill ph-medal text-2xl text-yellow-500 mb-1"></i>
                                <h4 className="font-bold">10 Yrs</h4>
                                <p className="text-xs text-gray-500">Experience</p>
                            </div>
                        </div>

                        <h3 className="text-lg font-bold mb-3">About Doctor</h3>
                        <p className="text-sm text-gray-500 leading-relaxed mb-8">
                            Dr. Michael Chen is a top specialist in Neurology at City Hospital. He has performed over 1,000 successful procedures and is known for his excellent patient care and expertise in treating complex nervous system disorders.
                        </p>

                        <h3 className="text-lg font-bold mb-4">Availability</h3>
                        <div className="flex gap-2 overflow-x-auto hide-scrollbar mb-6 pb-2">
                            {['Mon, 18', 'Tue, 19', 'Wed, 20', 'Thu, 21'].map((d, i) => (
                                <div key={i} className={`min-w-[80px] p-3 text-center border rounded-2xl cursor-pointer transition-all ${i === 0 ? 'bg-primary text-white border-primary shadow-md' : 'bg-white text-gray-500 border-gray-200'}`}>
                                    <div className="text-xs mb-1 opacity-80">{d.split(',')[0]}</div>
                                    <div className="font-bold">{d.split(',')[1]}</div>
                                </div>
                            ))}
                        </div>

                        <div className="grid grid-cols-3 gap-3 mb-8">
                            {['09:00 AM', '10:30 AM', '01:00 PM', '02:30 PM', '04:00 PM'].map((t, i) => (
                                <button key={i} className={`py-3 text-xs font-semibold rounded-xl transition-all ${i === 1 ? 'bg-primary/10 text-primary border border-primary' : 'bg-white border border-gray-200 text-gray-600'}`}>
                                    {t}
                                </button>
                            ))}
                        </div>

                        <button className="w-full py-4 bg-primary text-white rounded-2xl text-lg font-bold shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2" onClick={() => alert('Appointment Booked!')}>
                            Book Appointment <i className="ph-bold ph-arrow-right"></i>
                        </button>
                    </div>
                </div>
            );
        };

        const AppointmentsView = () => {
            const [tab, setTab] = useState('upcoming');

            return (
                <div className="pb-24 fade-in min-h-screen bg-gray-50">
                    <div className="bg-white p-6 pt-12 pb-4 border-b border-gray-100 shadow-sm sticky top-0 z-10">
                        <h2 className="text-2xl font-bold mb-6">Appointments</h2>
                        <div className="flex bg-gray-100 p-1.5 rounded-2xl relative z-10">
                            <button onClick={() => setTab('upcoming')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all z-10 ${tab === 'upcoming' ? 'bg-white shadow-sm text-primary' : 'text-gray-500'}`}>Upcoming</button>
                            <button onClick={() => setTab('history')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all z-10 ${tab === 'history' ? 'bg-white shadow-sm text-primary' : 'text-gray-500'}`}>History</button>
                        </div>
                    </div>

                    <div className="p-6 flex flex-col gap-5 relative z-0">
                        {tab === 'upcoming' ? (
                            <div className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                                <div className="flex justify-between items-start mb-4 border-b border-gray-50 pb-4">
                                    <div className="flex gap-3 items-center">
                                        <div className="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center text-primary">
                                            <i className="ph-fill ph-user-circle text-2xl"></i>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-md">Dr. Michael Chen</h4>
                                            <p className="text-xs text-gray-400">Neurologist</p>
                                        </div>
                                    </div>
                                    <span className="bg-green-100 text-green-600 text-[10px] uppercase font-bold px-3 py-1 rounded-lg">Confirmed</span>
                                </div>
                                <div className="flex justify-between items-center text-sm mb-5">
                                    <div className="flex items-center gap-1.5 font-medium text-gray-700">
                                        <i className="ph-fill ph-calendar-blank text-primary text-lg"></i> Mon, 18 Oct
                                    </div>
                                    <div className="flex items-center gap-1.5 font-medium text-gray-700">
                                        <i className="ph-fill ph-clock text-primary text-lg"></i> 10:30 AM
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button className="flex-1 py-3 bg-gray-100 text-gray-700 rounded-xl font-bold text-sm hover:bg-gray-200 transition-colors">Cancel</button>
                                    <button className="flex-1 py-3 bg-primary text-white rounded-xl font-bold text-sm shadow-md hover:shadow-lg transition-all">Reschedule</button>
                                </div>
                            </div>
                        ) : (
                            <div className="text-center text-gray-400 mt-10">
                                <i className="ph ph-calendar-x text-5xl mb-2"></i>
                                <p>No historical visits found.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const ProfileView = ({ user, setView }) => {
            const handleLogout = async () => {
                await supabase.auth.signOut();
            };

            return (
                <div className="pb-24 fade-in bg-gray-50 min-h-screen">
                    <div className="bg-primary text-white p-6 pt-16 rounded-b-[40px] text-center shadow-lg relative">
                        <div className="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4 backdrop-blur-sm border-4 border-primary shadow-inner">
                            <i className="ph-fill ph-user text-5xl"></i>
                        </div>
                        <h2 className="text-2xl font-bold">{user?.user_metadata?.name || 'User'}</h2>
                        <p className="opacity-80 text-sm mt-1">{user?.email}</p>
                    </div>

                    <div className="p-6 mt-4">
                        <div className="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden mb-6">
                            {[
                                { icon: 'ph-user', text: 'Personal Details' },
                                { icon: 'ph-bell-ringing', text: 'Notifications' },
                                { icon: 'ph-shield-check', text: 'Privacy & Security' },
                                { icon: 'ph-swap', text: 'Switch to Professional' },
                            ].map((item, i) => (
                                <div key={i} className="flex items-center gap-4 p-5 py-5 border-b border-gray-50 cursor-pointer hover:bg-gray-50 transition-colors">
                                    <div className="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-primary shrink-0">
                                        <i className={`ph ${item.icon} text-xl font-bold`}></i>
                                    </div>
                                    <span className="font-semibold text-gray-700 flex-1">{item.text}</span>
                                    <i className="ph ph-caret-right text-gray-400"></i>
                                </div>
                            ))}
                        </div>

                        <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 py-4 bg-red-50 text-red-500 rounded-2xl font-bold hover:bg-red-100 transition-colors">
                            <i className="ph-bold ph-sign-out text-lg"></i> Sign Out
                        </button>
                    </div>
                </div>
            );
        };

        const BottomNav = ({ current, setView }) => {
            const tabs = [
                { id: 'home', icon: 'ph-house' },
                { id: 'doctors', icon: 'ph-magnifying-glass' },
                { id: 'appointments', icon: 'ph-calendar-check' },
                { id: 'profile', icon: 'ph-user' }
            ];

            return (
                <div className="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white/90 backdrop-blur-lg border-t border-gray-100 pb-safe z-50 nav-bar">
                    <div className="flex justify-around items-center h-[72px] px-2 shadow-sm rounded-t-3xl overflow-hidden">
                        {tabs.map(t => {
                            const active = current === t.id || (t.id === 'doctors' && current.startsWith('doctor'));
                            return (
                                <div key={t.id} onClick={() => setView(t.id)}
                                    className={`relative flex flex-col items-center justify-center w-16 h-full cursor-pointer transition-all ${active ? 'text-primary' : 'text-gray-400 hover:text-gray-600'}`}>
                                    <i className={`${active ? 'ph-fill' : 'ph'} ${t.icon} text-[26px] mb-1 transition-transform ${active ? 'scale-110 -translate-y-1' : ''}`}></i>
                                    {active && <span className="absolute bottom-2 w-1 h-1 rounded-full bg-primary" />}
                                </div>
                            )
                        })}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
